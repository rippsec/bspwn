# Cockpit — monochrome
#  * background near-black, not pure black; text off-white, not pure white
#    (keeps strong contrast without the "bloom" pure white-on-black causes)
#  * UI is pure greyscale (cursor, borders, active tab); ANSI colours are
#    kept but heavily desaturated so git/ls/diff output stays readable
#  * no saturated deep blue/violet
# Same palette as polybar / conky / rofi / dunst / bspwm borders / tmux.

background            #111214
foreground            #e6e3dd
cursor                #f2efe9
cursor_text_color     #111214
selection_background  #34363c
selection_foreground  #f2efe9
url_color             #b0ada7

# black
color0   #1c1d21
color8   #5e6068
# red
color1   #c98a84
color9   #ddaaa4
# green
color2   #a3b88f
color10  #bfcfae
# yellow (soft gold)
color3   #c9b68e
color11  #ddcfae
# blue (soft sky, never deep blue)
color4   #98abb8
color12  #b7c5cf
# magenta (soft)
color5   #b9a3bf
color13  #cfbfd3
# cyan
color6   #93b5b0
color14  #b2ccc8
# white
color7   #c9c6c0
color15  #f2efe9

active_border_color    #f2efe9
