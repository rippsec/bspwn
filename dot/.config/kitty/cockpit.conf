# Cockpit — low-halation dark palette for myopia + astigmatism
#  * background dark slate, not pure black; text warm off-white, not pure white
#    (high contrast without the "bloom" pure white-on-black causes)
#  * ANSI blue/magenta lifted and desaturated: saturated blue/violet focus in
#    front of the retina and look blurry to short-sighted eyes
#  * amber cursor + selection with real contrast, visible at a glance
# Same palette as polybar / conky / rofi / dunst / bspwm borders.

background            #141820
foreground            #d8d4c7
cursor                #e8b04b
cursor_text_color     #141820
selection_background  #3a4250
selection_foreground  #f2eee2
url_color             #56c8b9

# black
color0   #222833
color8   #5c6576
# red
color1   #ef6a5a
color9   #ff8b7d
# green
color2   #9ccc65
color10  #b8e08a
# yellow / amber
color3   #e8b04b
color11  #f5c86e
# blue (soft sky, never deep blue)
color4   #7bb8d9
color12  #9fcde6
# magenta (soft)
color5   #c99bd6
color13  #ddb9e6
# cyan / teal
color6   #56c8b9
color14  #80dccf
# white
color7   #c9c5b9
color15  #f2eee2

active_border_color    #e8b04b
inactive_border_color  #2a313d
