# Cockpit — black / white / red, low-halation (myopia + astigmatism)
#  * background near-black, not pure black; text off-white, not pure white
#    (keeps strong contrast without the "bloom" pure white-on-black causes)
#  * UI accent crimson (cursor, borders, active tab); ANSI colours stay
#    distinct (soft gold, green, cyan) so git/ls/diff output stays readable
#  * no saturated deep blue/violet: those focus in front of the retina and
#    look blurry to short-sighted eyes
# Same palette as polybar / conky / rofi / dunst / bspwm borders / tmux.

background            #111214
foreground            #e6e3dd
cursor                #e5383b
cursor_text_color     #f2efe9
selection_background  #34363c
selection_foreground  #f2efe9
url_color             #ff6b6e

# black
color0   #1c1d21
color8   #5e6068
# red
color1   #e5383b
color9   #ff6b6e
# green
color2   #9ccc65
color10  #b8e08a
# yellow (soft gold)
color3   #d9b46a
color11  #ecd08f
# blue (soft sky, never deep blue)
color4   #8fb8d4
color12  #b1cfe3
# magenta (soft)
color5   #c99bd6
color13  #ddb9e6
# cyan
color6   #7fc4bb
color14  #a3dbd3
# white
color7   #c9c6c0
color15  #f2efe9

active_border_color    #e5383b
