# Cockpit - muted but distinguishable, low-halation (myopia + astigmatism, TN laptop panel)
#  * background lifted a little (#1d2024, was #111214) so blacks don't glow/bleed on the TN panel,
#    text soft off-white (not pure white): ~11.7:1 contrast without the bloom of white-on-black
#  * every ANSI hue is separated by lightness AND hue, never hue alone, so it survives a washed-out
#    panel: all pairs >= 20 dE2000 (blue vs cyan 20.8, green vs yellow 20.9; was 11.2 / 14.3), and
#    still >= 14 with chroma cut to 60%. Chroma stays moderate (no neon).
#  * blue is a periwinkle (L* 65), never deep blue: deep blue focuses in front of the retina and
#    blurs for short-sighted eyes. Bright variants are >= 10 dE from their normal twin.
#  * check: python3 scripts/palette_check.py   (contrast, dE matrix, washed-panel test)
# UI chrome (cursor, borders, tabs) stays greyscale like polybar / rofi / dunst / bspwm borders.

background            #1d2024
foreground            #dddad3
cursor                #ebe8e2
cursor_text_color     #1d2024
selection_background  #41454a
selection_foreground  #ebe8e2
url_color             #aec4ed

