[env]
TERM = "xterm-256color"

[window]
decorations = "full"
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true
opacity = 0.9

[window.padding]
x = 9
y = 9

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12
builtin_box_drawing = true

[font.normal]
family = "Atkinson Hyperlegible Mono"
style = "Medium"

[font.bold]
family = "BlexMono Nerd Font Mono"
style = "Medium"

[font.italic]
family = "BlexMono Nerd Font Mono"
style = "Medium"

[font.bold_italic]
family = "BlexMono Nerd Font Mono"
style = "Medium"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

# Cockpit palette (same as kitty/cockpit.conf): low-halation, myopia/astigmatism friendly
[colors.cursor]
text = "#141820"
cursor = "#e8b04b"

[colors.primary]
background = "#141820"
foreground = "#d8d4c7"

[colors.normal]
black = "#222833"
red = "#ef6a5a"
green = "#9ccc65"
yellow = "#e8b04b"
blue = "#7bb8d9"
magenta = "#c99bd6"
cyan = "#56c8b9"
white = "#c9c5b9"

[colors.bright]
black = "#5c6576"
red = "#ff8b7d"
green = "#b8e08a"
yellow = "#f5c86e"
blue = "#9fcde6"
magenta = "#ddb9e6"
cyan = "#80dccf"
white = "#f2eee2"

[colors.selection]
text = "#f2eee2"
background = "#3a4250"


[bell]
animation = "Linear"
duration = 0
color = "#171717"
command = "None"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>	"
save_to_clipboard = true




[cursor]
blink_interval = 750
unfocused_hollow = true
thickness = 0.15

[cursor.style]
shape = "Block"
blinking = "Off"

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = false
bindings = [
    { mouse = "Middle", action = "PasteSelection" },
]

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001f\u007f-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.mouse]
enabled = true

[hints.enabled.binding]
key = "U"
mods = "Control|Shift"

[keyboard]
bindings = [
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "Insert", mods = "Shift", action = "PasteSelection" },
    { key = "Up", mods = "Control|Shift", action = "ScrollLineUp" },
    { key = "Down", mods = "Control|Shift", action = "ScrollLineDown" },
    { key = "PageUp", mods = "Control|Shift", action = "ScrollPageUp" },
    { key = "PageDown", mods = "Control|Shift", action = "ScrollPageDown" },
    { key = "Home", mods = "Control|Shift", action = "ScrollToTop" },
    { key = "End", mods = "Control|Shift", action = "ScrollToBottom" },
    { key = "Minus", mods = "Control|Shift", action = "DecreaseFontSize" },
    { key = "Plus", mods = "Control|Shift", action = "IncreaseFontSize" },
    { key = "Key0", mods = "Control|Shift", action = "ResetFontSize" },
    { key = "Q", mods = "Control|Shift", action = "Quit" },
    { key = "L", mods = "Control", chars = "\f" },
]

[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
print_events = false
