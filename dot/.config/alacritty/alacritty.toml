[env]
TERM = "xterm-256color"

[window]
decorations = "full"
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true
opacity = 0.9

[window.padding]
x = 9
y = 9

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12
builtin_box_drawing = true

[font.normal]
family = "Atkinson Hyperlegible Mono"
style = "Medium"

[font.bold]
family = "Atkinson Hyperlegible Mono"
style = "Bold"

[font.italic]
family = "Atkinson Hyperlegible Mono"
style = "Italic"

[font.bold_italic]
family = "Atkinson Hyperlegible Mono"
style = "Italic"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

# Cockpit palette (same as kitty/cockpit.conf): muted but distinguishable.
# Design notes and the checker: see the header of kitty/cockpit.conf, `python3 scripts/palette_check.py`.
[colors.cursor]
text = "#1d2024"
cursor = "#ebe8e2"

[colors.primary]
background = "#272A34"
foreground = "#dddad3"

[colors.normal]
black = "#2e3135"
red = "#d78a7b"
green = "#92a883"
yellow = "#d2aa6c"
blue = "#839ecd"
magenta = "#c9a6c7"
cyan = "#66bec5"
white = "#c4c1ba"

[colors.bright]
black = "#888c92"
red = "#f8b3a5"
green = "#bbcdad"
yellow = "#f9d49e"
blue = "#aec4ed"
magenta = "#f0d1ed"
cyan = "#9ee6ec"
white = "#ebe8e2"

[colors.selection]
text = "#ebe8e2"
background = "#41454a"


[bell]
animation = "Linear"
duration = 0
color = "#171717"
command = "None"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>	"
save_to_clipboard = true




[cursor]
blink_interval = 750
unfocused_hollow = true
thickness = 0.15

[cursor.style]
shape = "Block"
blinking = "Off"

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = false
bindings = [
    { mouse = "Middle", action = "PasteSelection" },
]

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001f\u007f-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.mouse]
enabled = true

[hints.enabled.binding]
key = "U"
mods = "Control|Shift"

[keyboard]
bindings = [
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "Insert", mods = "Shift", action = "PasteSelection" },
    { key = "Up", mods = "Control|Shift", action = "ScrollLineUp" },
    { key = "Down", mods = "Control|Shift", action = "ScrollLineDown" },
    { key = "PageUp", mods = "Control|Shift", action = "ScrollPageUp" },
    { key = "PageDown", mods = "Control|Shift", action = "ScrollPageDown" },
    { key = "Home", mods = "Control|Shift", action = "ScrollToTop" },
    { key = "End", mods = "Control|Shift", action = "ScrollToBottom" },
    { key = "Minus", mods = "Control|Shift", action = "DecreaseFontSize" },
    { key = "Plus", mods = "Control|Shift", action = "IncreaseFontSize" },
    { key = "Key0", mods = "Control|Shift", action = "ResetFontSize" },
    { key = "Q", mods = "Control|Shift", action = "Quit" },
    { key = "L", mods = "Control", chars = "\f" },
]

[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
print_events = false
