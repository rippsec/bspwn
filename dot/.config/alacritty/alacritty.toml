[env]
TERM = "xterm-256color"

[window]
decorations = "full"
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true
opacity = 0.9

[window.padding]
x = 9
y = 9

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12
builtin_box_drawing = true

[font.normal]
family = "Atkinson Hyperlegible Mono"
style = "Medium"

[font.bold]
family = "BlexMono Nerd Font Mono"
style = "Medium"

[font.italic]
family = "BlexMono Nerd Font Mono"
style = "Medium"

[font.bold_italic]
family = "BlexMono Nerd Font Mono"
style = "Medium"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

# Cockpit palette (same as kitty/cockpit.conf): monochrome
[colors.cursor]
text = "#111214"
cursor = "#f2efe9"

[colors.primary]
background = "#111214"
foreground = "#e6e3dd"

[colors.normal]
black = "#1c1d21"
red = "#c98a84"
green = "#a3b88f"
yellow = "#c9b68e"
blue = "#98abb8"
magenta = "#b9a3bf"
cyan = "#93b5b0"
white = "#c9c6c0"

[colors.bright]
black = "#5e6068"
red = "#ddaaa4"
green = "#bfcfae"
yellow = "#ddcfae"
blue = "#b7c5cf"
magenta = "#cfbfd3"
cyan = "#b2ccc8"
white = "#f2efe9"

[colors.selection]
text = "#f2efe9"
background = "#34363c"


[bell]
animation = "Linear"
duration = 0
color = "#171717"
command = "None"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>	"
save_to_clipboard = true




[cursor]
blink_interval = 750
unfocused_hollow = true
thickness = 0.15

[cursor.style]
shape = "Block"
blinking = "Off"

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = false
bindings = [
    { mouse = "Middle", action = "PasteSelection" },
]

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001f\u007f-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.mouse]
enabled = true

[hints.enabled.binding]
key = "U"
mods = "Control|Shift"

[keyboard]
bindings = [
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "Insert", mods = "Shift", action = "PasteSelection" },
    { key = "Up", mods = "Control|Shift", action = "ScrollLineUp" },
    { key = "Down", mods = "Control|Shift", action = "ScrollLineDown" },
    { key = "PageUp", mods = "Control|Shift", action = "ScrollPageUp" },
    { key = "PageDown", mods = "Control|Shift", action = "ScrollPageDown" },
    { key = "Home", mods = "Control|Shift", action = "ScrollToTop" },
    { key = "End", mods = "Control|Shift", action = "ScrollToBottom" },
    { key = "Minus", mods = "Control|Shift", action = "DecreaseFontSize" },
    { key = "Plus", mods = "Control|Shift", action = "IncreaseFontSize" },
    { key = "Key0", mods = "Control|Shift", action = "ResetFontSize" },
    { key = "Q", mods = "Control|Shift", action = "Quit" },
    { key = "L", mods = "Control", chars = "\f" },
]

[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
print_events = false
