-- =====================================================================
--  COCKPIT HUD — right-hand instrument panel for bspwm (1600x900)
--  Sits under the polybar islands; same "cockpit" palette.
--  color  = text (off-white)         color1 = white (headings)
--  color2 = grey (graphs/bars)       color3 = label grey
--  color4 = muted                   color5 = bright white (alarm)
-- =====================================================================
conky.config = {
    alignment = 'top_left',  -- absolute position: right column under the bar
    gap_x = 1277,  -- (+16/+20: conky offsets desktop windows by this much here)
    gap_y = 62,
    minimum_width = 290, maximum_width = 290,
    minimum_height = 806, maximum_height = 806,
    border_inner_margin = 18,

    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    background = false,

    update_interval = 2.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    use_xft = true,
    xftalpha = 1,
    uppercase = false,
    use_spacer = 'none',
    draw_shades = false, draw_outline = false, draw_borders = false,
    draw_graph_borders = false,
    default_bar_width = 290, default_bar_height = 4,
    default_graph_width = 290, default_graph_height = 26,
    top_name_width = 16,

    font = 'Atkinson Hyperlegible Mono:Medium:size=9',
    default_color = '#e6e3dd',
    color1 = '#f2efe9',  -- white accent (monochrome)
    color2 = '#b0ada7',
    color3 = '#8e9099',
    color4 = '#4b4d55',
    color5 = '#ffffff',

    lua_load = '~/.config/conky/hud.lua',
    lua_draw_hook_pre = 'hud_bg',
};

conky.text = [[
${font Atkinson Hyperlegible Mono:SemiBold:size=30}${time %H:%M}${font Atkinson Hyperlegible Mono:Medium:size=12}${color1} ${time %S}${color}${font}
${color3}${time %A %d %B %Y}${color}
${voffset 156}
${voffset 6}${color1}${font Atkinson Hyperlegible Mono:Bold:size=8}SYSTEM ${color4}${hr 1}${font}${color}
${color3}HOST${alignr}${color}${nodename} · ${execi 3600 uname -r | cut -d- -f1}
${color3}UPTIME${alignr}${color}${uptime_short} · load ${loadavg 1}
${voffset 6}${color1}${font Atkinson Hyperlegible Mono:Bold:size=8}CPU ${color4}${hr 1}${font}${color}
${color3}LOAD${alignr}${if_match ${cpu cpu0}>=85}${color5}${else}${color}${endif}${cpu cpu0}%${color} · ${freq_g}GHz · ${hwmon coretemp temp 1}°C
${color2}${cpugraph cpu0 22,290 b0ada7 f2efe9 -t}${color}
${color3}${top name 1}${alignr}${color}${top cpu 1}%
${color3}${top name 2}${alignr}${color}${top cpu 2}%
${voffset 6}${color1}${font Atkinson Hyperlegible Mono:Bold:size=8}MEMORY ${color4}${hr 1}${font}${color}
${color3}RAM${alignr}${color}${mem} / ${memmax} · ${memperc}%
${color2}${membar 4,290}${color}
${color3}SWAP${alignr}${color}${swap} / ${swapmax}
${voffset 6}${color1}${font Atkinson Hyperlegible Mono:Bold:size=8}THERMAL ${color4}${hr 1}${font}${color}
${color3}CPU${alignr}${color}${hwmon coretemp temp 1}°
${color3}FAN${alignr}${color}${hwmon thinkpad fan 1} rpm
${voffset 6}${color1}${font Atkinson Hyperlegible Mono:Bold:size=8}STORAGE ${color4}${hr 1}${font}${color}
${color3}ROOT${alignr}${color}${fs_used /} / ${fs_size /} · ${fs_used_perc /}%
${color2}${fs_bar 4,290 /}${color}
${color3}I/O${alignr}${color}R ${diskio_read} · W ${diskio_write}
${voffset 6}${color1}${font Atkinson Hyperlegible Mono:Bold:size=8}NETWORK ${color4}${hr 1}${font}${color}
${color3}SSID${alignr}${color}${wireless_essid wlan0} · ${wireless_link_qual_perc wlan0}%
${execpi 10 ~/.config/conky/hud/ips}
${color3}RX ${color2}${downspeed wlan0}${alignr}${color3}TX ${color1}${upspeed wlan0}${color}
${color2}${downspeedgraph wlan0 16,140 b0ada7 b0ada7}${alignr}${color1}${upspeedgraph wlan0 16,140 f2efe9 f2efe9}${color}
${voffset 6}${color1}${font Atkinson Hyperlegible Mono:Bold:size=8}POWER ${color4}${hr 1}${font}${color}
${color3}INTERNAL${alignr}${if_match ${battery_percent BAT0}<=20}${color5}${else}${color}${endif}${battery_percent BAT0}% · ${battery_status BAT0}${color}
${color2}${battery_bar 4,290 BAT0}${color}
${color3}SLICE${alignr}${if_match ${battery_percent BAT1}<=20}${color5}${else}${color}${endif}${battery_percent BAT1}% · ${battery_status BAT1}${color}
${color2}${battery_bar 4,290 BAT1}${color}
]];
