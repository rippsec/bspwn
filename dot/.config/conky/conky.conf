conky.config = {
    alignment = 'middle_middle',
    background = false,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    gap_x = 0,
    gap_y = 0,
    maximum_width = 1600,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    update_interval = 1.0,
    uppercase = true,
    use_spacer = 'none',
    use_xft = true,
    font = 'BlexMono Nerd Font:regular:size=100',
    color0 = '#b7c2d7',
};

conky.text = [[

# ASCII STUFF (DECORATIONS ABOVE THE CLOCK)
#${voffset -100}${font BlexMono Nerd Font:regular:size=20}${color0}${alignc}${time %A}$color
#${voffset -150}${font FreeMono:Bold:size=9}${color0}${alignc}${execpi 3600 ~/.config/conky/bat}$color
${voffset -180}${font FreeMono:Bold:size=9}${color0}${alignc}${execpi 3600 ~/.config/conky/x}$color

# CLOCK
${voffset -30}${font BlexMono Nerd Font:regular:size=40}${color0}${alignc}${time %H:%M:%S}$color

# LONG LINE FOR THE DATE
${voffset -100}${font BlexMono Nerd Font:Medium:size=20}${color0}${alignc}${time %A %d %B %Y}$color

# CALENDAR
${voffset 20}${font BlexMono Nerd Font:regular:size=26}${color0}${alignc}${execpi 9999 ~/.config/conky/calendar}$color

# MORE DECORATIONS
#${voffset 0}${font FreeMono:Bold:size=9}${color0}${alignc}${execpi 3600 ~/.config/conky/x}$color

]];
