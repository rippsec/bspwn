-- Desktop notes / todo widget: renders ~/notes/desktop.md (markdown) on the wallpaper.
-- Edit: Super+n   Add todo: Super+Shift+n   Tick task: Super+Ctrl+n   (see notes/notes.py)
conky.config = {
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 44,
    background = false,
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    border_inner_margin = 16,
    border_width = 0,
    minimum_width = 370,
    maximum_width = 370,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,
    own_window = true,
    own_window_class = 'ConkyNotes',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 1.0,
    text_buffer_size = 16384,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    font = 'BlexMono Nerd Font:regular:size=11',
    default_color = '#c9d1e0',

    lua_load = '~/.config/conky/notes/bg.lua',
    lua_draw_hook_pre = 'draw_notes_bg',
};

conky.text = [[
${execpi 1 python3 ~/.config/conky/notes/notes.py render --cols 38 --size 11 --max-lines 24}
]];
