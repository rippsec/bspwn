; =====================================================================
;  COCKPIT — polybar for bspwm (Dell Precision 7780, 1600x900)
;  Three floating islands, evenly spaced (8 px gaps):
;  [workspaces · clock] 8..384   [instruments] 392..980   [link · power] 988..1592
;
;  Palette "cockpit":
;   * dark grey instead of pure black and warm off-white instead of pure white
;   * accents in amber / teal / green; no saturated blue/violet
;   * Atkinson Hyperlegible Mono (Braille Institute)
;  Same palette in kitty, alacritty, rofi, dunst, conky, bspwm borders, i3lock.
; =====================================================================

[colors]
bg       = #E6141820
bg-solid = #141820
bg-alt   = #222833
border   = #2a313d
fg       = #d8d4c7
fg-dim   = #8b919c
muted    = #4a5260
amber    = #e8b04b
teal     = #56c8b9
green    = #9ccc65
orange   = #f0954a
red      = #ef6a5a

; legacy names used by older modules/scripts
background = ${colors.bg}
foreground = ${colors.fg}
primary    = ${colors.fg}
alert      = ${colors.red}
disabled   = ${colors.muted}

; ---------------------------------------------------------------------
[bar/base]
height = 28
offset-y = 6
radius = 9
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 1
border-color = ${colors.border}
line-size = 2
padding-left = 8px
padding-right = 8px
module-margin = 0
separator = "%{F#2a313d}│%{F-}"
separator-padding = 0

; 0: main text — Atkinson Hyperlegible Mono
font-0 = "Atkinson Hyperlegible Mono:pixelsize=12:style=Medium;3"
; 1: instrument labels (%{T2})
font-1 = "Atkinson Hyperlegible Mono:pixelsize=10:style=Bold;3"
; 2..8: icon fonts (format-font / %{Tn} indices used by modules below)
font-2 = "Symbols Nerd Font Mono:pixelsize=12;3"
font-3 = "Symbols Nerd Font Mono:pixelsize=12;3"
font-4 = "Symbols Nerd Font Mono:pixelsize=13;3"
font-5 = "Symbols Nerd Font Mono:pixelsize=15;3"
font-6 = "Symbols Nerd Font Mono:pixelsize=14;3"
font-7 = "Symbols Nerd Font Mono:pixelsize=15;3"
font-8 = "Symbols Nerd Font Mono:pixelsize=11;3"
; 9: fallback for gauge blocks ▁▃▅█ and arrows ↓↑ (missing in Atkinson)
font-9 = "BlexMono Nerd Font Mono:pixelsize=13;3"

enable-ipc = true
wm-restack = bspwm
cursor-click = pointer

[bar/left]
inherit = bar/base
width = 376
offset-x = 8
modules-left = xworkspaces
modules-right = date

[bar/center]
inherit = bar/base
width = 588
offset-x = 392
modules-center = cpu memory gpu temperature net

[bar/right]
inherit = bar/base
width = 604
offset-x = 988
modules-left = jarvis keydbg
modules-right = lhost rhost pulseaudio backlight batteries micvol systray pwmenu

; =====================================================================
;  LEFT ISLAND
; =====================================================================

[module/xworkspaces]
type = internal/xworkspaces
; amber dot = current · ring-dot = has windows · faint ring = empty
label-active = 
label-active-foreground = ${colors.amber}
label-active-padding = 3px
label-occupied = 
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 3px
label-urgent = 
label-urgent-foreground = ${colors.red}
label-urgent-padding = 3px
label-empty = 
label-empty-foreground = ${colors.muted}
label-empty-padding = 3px
format-font = 3

[module/date]
type = internal/date
interval = 1
date = %d %b
time = %H:%M
date-alt = %Y-%m-%d
time-alt = %H:%M:%S
label = "%{A3:gsimplecal:}%{T2}%{F#8b919c}%date%%{F-}%{T-}  %{F#e8b04b}%time%%{F-}%{A}"
format-padding = 6px

; =====================================================================
;  CENTER ISLAND — instruments (mini gauge + value; teal → amber → red)
; =====================================================================

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-font = 2
format-prefix-foreground = ${colors.fg-dim}
format = <ramp-load> <label>
format-padding = 6px
label = %percentage:2%%
warn-percentage = 90
format-warn-prefix = "CPU "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${colors.red}
format-warn = <ramp-load> <label-warn>
format-warn-padding = 6px
label-warn = %percentage:2%%
label-warn-foreground = ${colors.red}
ramp-load-0 = ▁
ramp-load-1 = ▂
ramp-load-2 = ▃
ramp-load-3 = ▄
ramp-load-4 = ▅
ramp-load-5 = ▆
ramp-load-6 = ▇
ramp-load-7 = █
ramp-load-0-foreground = ${colors.teal}
ramp-load-1-foreground = ${colors.teal}
ramp-load-2-foreground = ${colors.teal}
ramp-load-3-foreground = ${colors.amber}
ramp-load-4-foreground = ${colors.amber}
ramp-load-5-foreground = ${colors.orange}
ramp-load-6-foreground = ${colors.red}
ramp-load-7-foreground = ${colors.red}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-font = 2
format-prefix-foreground = ${colors.fg-dim}
format = <ramp-used> <label>
format-padding = 6px
label = %percentage_used:2%%
warn-percentage = 90
format-warn-prefix = "RAM "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${colors.red}
format-warn = <ramp-used> <label-warn>
format-warn-padding = 6px
label-warn = %percentage_used:2%%
label-warn-foreground = ${colors.red}
ramp-used-0 = ▁
ramp-used-1 = ▂
ramp-used-2 = ▃
ramp-used-3 = ▄
ramp-used-4 = ▅
ramp-used-5 = ▆
ramp-used-6 = ▇
ramp-used-7 = █
ramp-used-0-foreground = ${colors.teal}
ramp-used-1-foreground = ${colors.teal}
ramp-used-2-foreground = ${colors.teal}
ramp-used-3-foreground = ${colors.amber}
ramp-used-4-foreground = ${colors.amber}
ramp-used-5-foreground = ${colors.orange}
ramp-used-6-foreground = ${colors.red}
ramp-used-7-foreground = ${colors.red}

[module/gpu]
type = custom/script
; NVIDIA dGPU usage + temp; "off" while runtime-suspended (never wakes it)
exec = ~/.config/polybar/scripts/gpu.sh
interval = 2
label = %output%
format-padding = 6px
click-left = nvidia-settings &

[module/temperature]
type = internal/temperature
interval = 2
; CPU package sensor, by type (zone numbers change between boots)
zone-type = x86_pkg_temp
base-temperature = 40
warn-temperature = 88
units = false
format-prefix = "TMP "
format-prefix-font = 2
format-prefix-foreground = ${colors.fg-dim}
format = <ramp> <label>
format-padding = 6px
label = %temperature-c%°
format-warn-prefix = "TMP "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${colors.red}
format-warn = <ramp> <label-warn>
format-warn-padding = 6px
label-warn = %temperature-c%°
label-warn-foreground = ${colors.red}
ramp-0 = ▂
ramp-1 = ▄
ramp-2 = ▆
ramp-3 = █
ramp-0-foreground = ${colors.teal}
ramp-1-foreground = ${colors.amber}
ramp-2-foreground = ${colors.orange}
ramp-3-foreground = ${colors.red}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
label-mounted = "%{T2}%{F#8b919c}SSD%{F-}%{T-} %percentage_used%%"
label-mounted-padding = 8px
label-unmounted = %mountpoint% n/a
label-unmounted-foreground = ${colors.muted}

[module/net]
type = internal/network
interface-type = wireless
interval = 2
speed-unit = ""
format-connected = <label-connected>
label-connected = "%{T2}%{F#8b919c}NET%{F-}%{T-} %{F#56c8b9}↓%{F-}%downspeed:5% %{F#e8b04b}↑%{F-}%upspeed:5%"
label-connected-padding = 6px
format-disconnected = <label-disconnected>
label-disconnected = "%{T2}%{F#8b919c}NET%{F-}%{T-} %{F#ef6a5a}offline%{F-}"
label-disconnected-padding = 8px

; =====================================================================
;  RIGHT ISLAND — link + power
; =====================================================================

[module/jarvis]
type = custom/script
; JARVIS assistant state (~/.bspwn/jarvis): click = talk, right = wake word, middle = cancel
exec = ~/.local/bin/jarvis polybar
interval = 1
label = %output%
format-padding = 6px
click-left = ~/.local/bin/jarvis listen &
click-right = ~/.local/bin/jarvis wake &
click-middle = ~/.local/bin/jarvis stop &

[module/touchgrass]
type = custom/script
interval = 1
exec = ~/.config/bspwm/custom/touchgrass status
click-left =  ~/.config/bspwm/custom/touchgrass reset
click-right = ~/.config/bspwm/custom/touchgrass lock-now
# format-prefix = " "

;==========================================================

[module/floatall]
type = custom/script
interval = 1
exec = ~/.config/sxhkd/scripts/float-all-toggle status
click-left = ~/.config/sxhkd/scripts/float-all-toggle toggle

;==========================================================

[module/kblayout]
type = custom/script
exec = ~/.config/polybar/scripts/kb-layout.sh
# interval = 1
click-left = ~/.config/polybar/scripts/kb-layout.sh switch
format = <label>
label = %output%
format-padding = 5px

;==========================================================

[module/keydbg]
type = custom/script
exec = ~/.config/polybar/scripts/key-indicator.py
# interval = 0
tail = true
format = <label>
format-font = 4

;==========================================================

[module/shift]
type = custom/script
exec = ~/.config/polybar/scripts/shift-indicator.py
interval = 0
tail = true
format = %{T3}<label>%{T-}

;==========================================================

; study module for time management

[module/study-timer]
type = custom/script
exec = ~/.config/polybar/scripts/study-timer.sh status
interval = 1
click-left = ~/.config/polybar/scripts/study-timer.sh toggle
click-right = ~/.config/polybar/scripts/study-timer.sh reset
format = <label>
label = %output%
label-padding = 9px

;==========================================================


; battery module, combines all BAT* batteries in one output (single BAT0 on the Dell)
[module/batteries]
type = custom/script
exec = ~/.config/polybar/scripts/battery_combined.sh
;interval = 30 
format = %{T8}<label>%{T-}
label = %output%
format-padding = 5px
click-left = ~/.config/polybar/scripts/battery_combined.sh --details


;==========================================================


[module/lhost]
type = custom/script
exec = ~/.config/polybar/scripts/mylhost.sh
format = <label>
label = %output%
label-padding = 5px
click-left = ~/.config/polybar/scripts/mylhost.sh --copy
click-right = ~/.config/polybar/scripts/mylhost.sh --edit


;==========================================================


[module/rhost]
type = custom/script
exec = ~/.config/polybar/scripts/mytarget.sh --bar
format  = <label>
label = %output%
label-padding = 5px
click-left = ~/.config/polybar/scripts/mytarget.sh --copy
click-right = ~/.config/polybar/scripts/mytarget.sh --edit


;==========================================================

[module/micvol]
type = custom/script
exec = ~/.config/polybar/scripts/micvol.sh
tail = true
format = <label>
format-font = 5
label = %output%


;==========================================================


[module/systray]
type = internal/tray
format-margin = 6px
tray-spacing = 4px
tray-size = 55%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-foreground = ${colors.fg}
format-volume = %{A4:~/.config/polybar/scripts/notivol.sh up:}%{A5:~/.config/polybar/scripts/notivol.sh down:}<ramp-volume>%{A}%{A}
format-volume-padding = 5px

format-volume-font = 6
label-muted-font = 6

enable-scroll = true
label-muted = 
label-muted-foreground = ${colors.red}
label-muted-padding = 5px
ramp-volume-0 = "" 
ramp-volume-1 = "" 
ramp-volume-2 = ""  


;==========================================================

[module/backlight]
;type = internal/xbacklight
type = internal/backlight
; Use the following command to list available cards:
; $ ls -1 /sys/class/backlight/
card = intel_backlight
;card = amdgpu_bl0
format = %{A4:~/.config/polybar/scripts/notibkl.sh up:}%{A5:~/.config/polybar/scripts/notibkl.sh down:}<ramp>%{A}%{A}
format-font = 7
enable-scroll=true
format-padding = 5px
ramp-0 = "󰃞"
ramp-1 = "󰃟"
ramp-2 = "󰃠"
scroll-up = ~/.config/polybar/scripts/notibkl.sh up
scroll-down = ~/.config/polybar/scripts/notibkl.sh down


;==========================================================
; === INACTIVE MODULES (available for future use) ===

;==========================================================

[module/pwmenu]
type = custom/text
format = "⏻"
format-font = 6
format-padding = 6px
format-foreground = ${colors.amber}
click-left = ~/.config/polybar/scripts/pwmenu.sh &

; =====================================================================
;  INACTIVE MODULES (available)
; =====================================================================

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.fg}

[module/caps]
type = internal/xkeyboard
blacklist-0 = num lock
format = <label-indicator>
label-indicator-on-capslock = A
label-indicator-on-capslock-foreground = ${colors.red}
label-indicator-off-capslock = a
label-indicator-on-capslock-padding = 15px
label-indicator-off-capslock-padding = 15px

[module/autocolor]
type = custom/script
exec = echo ""
click-left = python3 ~/.config/polybar/scripts/color_picker_gui.py
label-padding = 5px

[module/menu]
type = custom/text
format = ☰
format-font = 9
format-padding = 2
click-left = ~/.config/jgmenu/launch-jgmenu.sh &

[settings]
pseudo-transparency = true

; vim:ft=dosini
