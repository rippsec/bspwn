; =====================================================================
;  COCKPIT — polybar for bspwm (ThinkPad T450, 1600x900)
;  Five floating islands (two single-button ones at the edges):
;  [launcher] 8..44   [workspaces · keyboard · instruments] 44..692   [clock, centred] 702..898   [link · tray] 908..1548   [power] 1548..1592
;
;  Palette "cockpit":
;   * dark grey instead of pure black and warm off-white instead of pure white
;   * monochrome: black / greys / white only (no saturated colour at all);
;     gauges get brighter with load, alarms are shown inverted (black on white)
;   * Atkinson Hyperlegible Mono
;  Same palette in kitty, alacritty, rofi, dunst, conky, bspwm borders, i3lock.
; =====================================================================

[colors]
bg       = #E6111214
bg-solid = #111214
bg-alt   = #1c1d21
border   = #2a2b30
fg       = #e6e3dd
fg-dim   = #8e9099
muted    = #4b4d55
accent   = #f2efe9
silver   = #6f7178
green    = #9ccc65
rose     = #b0ada7
; the only colour in the bar: warnings (live mic, sound muted)
warn     = #e5383b
red      = #ffffff

; legacy names used by older modules/scripts
background = ${colors.bg}
foreground = ${colors.fg}
primary    = ${colors.fg}
alert      = ${colors.red}
disabled   = ${colors.muted}

; ---------------------------------------------------------------------
[bar/base]
height = 28
offset-y = 6
radius = 0
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0
border-color = ${colors.border}
line-size = 2
padding-left = 8px
padding-right = 8px
module-margin = 0
separator = "%{F#2a2b30}│%{F-}"
separator-padding = 0

; 0: main text — Atkinson Hyperlegible Mono
font-0 = "Atkinson Hyperlegible Mono:pixelsize=11:style=Medium;3"
; 1: instrument labels (%{T2})
font-1 = "Atkinson Hyperlegible Mono:pixelsize=9:style=Bold;3"
; 2..8: icon fonts (format-font / %{Tn} indices used by modules below)
font-2 = "Symbols Nerd Font Mono:pixelsize=12;3"
font-3 = "Symbols Nerd Font Mono:pixelsize=12;3"
font-4 = "Symbols Nerd Font Mono:pixelsize=12;3"
font-5 = "Symbols Nerd Font Mono:pixelsize=15;3"
font-6 = "Symbols Nerd Font Mono:pixelsize=14;3"
font-7 = "Symbols Nerd Font Mono:pixelsize=15;3"
font-8 = "Symbols Nerd Font Mono:pixelsize=11;3"
; 9: fallback for gauge blocks ▁▃▅█ and arrows ↓↑ (missing in Atkinson)
font-9 = "BlexMono Nerd Font Mono:pixelsize=12;3"
; 10: CJK for the 四 launcher button (same glyph as the wallpaper emblem)
font-10 = "Noto Sans CJK JP:style=Bold:pixelsize=15;3"
; 11: launcher button icon (Kali dragon, U+F327) — bigger than the other icons
font-11 = "Symbols Nerd Font Mono:pixelsize=21;4"

enable-ipc = true
wm-restack = bspwm
cursor-click = pointer
; time window that separates a click from a double click (LHOST/RHOST)
double-click-interval = 250

[bar/launcher]
; the Kali launcher button is its own little island on the far left, mirroring the power button on the far right
inherit = bar/base
width = 36
offset-x = 8
padding-left = 0px
padding-right = 0px
; flush against the left island (which starts with a thin separator): the two read as one continuous bar
modules-center = launcher

[bar/left]
inherit = bar/base
; layout: 8 + 36 (launcher) + 648 (flush) + 8 + 200 + 8 + 640 + 44 (power, flush) + 8 = 1600
width = 648
offset-x = 44
; flush with the launcher island; xworkspaces draws the thin separator on its left edge (mirrors the power island on the right)
padding-left = 0px
modules-left = xworkspaces app-term app-brave app-files
modules-right = cpu memory filesystem temperature keydbg

[bar/center]
inherit = bar/base
width = 200
offset-x = 700
modules-center = date

[bar/power]
; the power button is its own little island so a crowded systray can never push it off screen
inherit = bar/base
width = 44
offset-x = 1548
padding-left = 0px
padding-right = 0px
; separator on its inner edge, flush against the right island: one continuous bar
separator =
modules-left = vsep pwmenu

[bar/right]
inherit = bar/base
width = 640
offset-x = 908
; inner (left) side padding mirrors the left island's inner (right) side: 20 px
padding-left = 20px
; no separators here: this island is the fullest one
separator =
modules-right = servermode modetoggle pulseaudio backlight batteries micvol systray
modules-left = lhost vsep rhost

; =====================================================================
;  LEFT ISLAND
; =====================================================================

[module/launcher]
; 四 button: full-screen app launcher (rofi/launchpad.rasi)
type = custom/text
format = ""
format-font = 12
format-foreground = ${colors.fg}
format-padding = 6px
click-left = ~/.config/polybar/scripts/launchpad.sh &

[module/app-term]
; terminal: left = alacritty + tmux session (like super+Return), right = plain alacritty
type = custom/text
format = "󰆍"
format-font = 6
format-foreground = ${colors.fg-dim}
format-padding = 5px
click-left = alacritty -e bash -c "tmux attach-session -t 0 || tmux new-session -s 0" &
click-right = alacritty &

[module/app-brave]
type = custom/text
format = "󰖟"
format-font = 6
format-foreground = ${colors.fg-dim}
format-padding = 5px
click-left = brave-browser &

[module/app-files]
; file manager: left = Thunar in ~, right = Thunar in ~/Downloads
type = custom/text
format = "󰉋"
format-font = 6
format-foreground = ${colors.fg-dim}
format-padding = 5px
click-left = thunar &
click-right = thunar ~/Downloads &

[module/xworkspaces]
type = internal/xworkspaces
; the thin separator on its left edge joins it to the launcher island (it is the first module of the left island)
format-prefix = "%{F#2a2b30}│%{F-}"
; white dot = current · ring-dot = has windows · faint ring = empty
label-active = 
label-active-foreground = ${colors.accent}
label-active-padding = 3px
label-occupied = 
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 3px
label-urgent = 
label-urgent-foreground = ${colors.fg}
label-urgent-padding = 3px
label-empty = 
label-empty-foreground = ${colors.muted}
label-empty-padding = 3px
format-font = 3

[module/date]
type = internal/date
interval = 30
date = %d %b
time = %H:%M
; click: calendar dropdown under the clock (scripts/calendar-popup.py)
label = "%{A1:~/.config/polybar/scripts/calendar-popup.py &:}%{A3:~/.config/polybar/scripts/calendar-popup.py &:}%{F#f2efe9}%date% %time%%{F-}%{A}%{A}"
format-padding = 6px

; =====================================================================
;  CENTER ISLAND — instruments (mini gauge + value; dim grey → grey → white → inverted alarm)
; =====================================================================

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "%{T3}%{T-} "
format-prefix-foreground = ${colors.fg-dim}
format = <ramp-load>
; with value: format = <ramp-load> <label>
format-padding = 6px
label = %percentage:2%%
warn-percentage = 90
format-warn-prefix = "%{T3}%{T-} "
format-warn-prefix-foreground = ${colors.fg}
format-warn = <label-warn>
format-warn-padding = 6px
label-warn = "!"
label-warn-foreground = ${colors.bg-solid}
label-warn-background = ${colors.fg}
label-warn-padding = 0
ramp-load-0 = ▁
ramp-load-1 = ▂
ramp-load-2 = ▃
ramp-load-3 = ▄
ramp-load-4 = ▅
ramp-load-5 = ▆
ramp-load-6 = ▇
ramp-load-7 = █
ramp-load-0-foreground = ${colors.silver}
ramp-load-1-foreground = ${colors.silver}
ramp-load-2-foreground = ${colors.silver}
ramp-load-3-foreground = ${colors.rose}
ramp-load-4-foreground = ${colors.rose}
ramp-load-5-foreground = ${colors.accent}
ramp-load-6-foreground = ${colors.accent}
ramp-load-7-foreground = ${colors.accent}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{T3}%{T-} "
format-prefix-foreground = ${colors.fg-dim}
format = <ramp-used>
; with value: format = <ramp-used> <label>
format-padding = 6px
label = %percentage_used:2%%
warn-percentage = 90
format-warn-prefix = "%{T3}%{T-} "
format-warn-prefix-foreground = ${colors.fg}
format-warn = <label-warn>
format-warn-padding = 6px
label-warn = "!"
label-warn-foreground = ${colors.bg-solid}
label-warn-background = ${colors.fg}
label-warn-padding = 0
ramp-used-0 = ▁
ramp-used-1 = ▂
ramp-used-2 = ▃
ramp-used-3 = ▄
ramp-used-4 = ▅
ramp-used-5 = ▆
ramp-used-6 = ▇
ramp-used-7 = █
ramp-used-0-foreground = ${colors.silver}
ramp-used-1-foreground = ${colors.silver}
ramp-used-2-foreground = ${colors.silver}
ramp-used-3-foreground = ${colors.rose}
ramp-used-4-foreground = ${colors.rose}
ramp-used-5-foreground = ${colors.accent}
ramp-used-6-foreground = ${colors.accent}
ramp-used-7-foreground = ${colors.accent}

[module/temperature]
type = internal/temperature
interval = 2
; CPU package sensor, by type (zone numbers change between boots)
zone-type = x86_pkg_temp
base-temperature = 40
warn-temperature = 88
units = false
format-prefix = "%{T3}%{T-} "
format-prefix-foreground = ${colors.fg-dim}
format = <ramp>
; with value: format = <ramp> <label>
format-padding = 6px
label = %temperature-c%°
format-warn-prefix = "%{T3}%{T-} "
format-warn-prefix-foreground = ${colors.fg}
format-warn = <label-warn>
format-warn-padding = 6px
label-warn = "!"
label-warn-foreground = ${colors.bg-solid}
label-warn-background = ${colors.fg}
label-warn-padding = 0
ramp-0 = ▂
ramp-1 = ▄
ramp-2 = ▆
ramp-3 = █
ramp-0-foreground = ${colors.silver}
ramp-1-foreground = ${colors.rose}
ramp-2-foreground = ${colors.accent}
ramp-3-foreground = ${colors.accent}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
; gauge = how full the root disk is (more blocks = less space left)
format-mounted-prefix = "%{T3}󰋊%{T-} "
format-mounted-prefix-foreground = ${colors.fg-dim}
format-mounted = <ramp-capacity>
format-mounted-padding = 6px
format-unmounted = <label-unmounted>
label-unmounted = %mountpoint% n/a
label-unmounted-foreground = ${colors.muted}
ramp-capacity-0 = ▁
ramp-capacity-1 = ▂
ramp-capacity-2 = ▃
ramp-capacity-3 = ▄
ramp-capacity-4 = ▅
ramp-capacity-5 = ▆
ramp-capacity-6 = ▇
ramp-capacity-7 = █
ramp-capacity-0-foreground = ${colors.silver}
ramp-capacity-1-foreground = ${colors.silver}
ramp-capacity-2-foreground = ${colors.silver}
ramp-capacity-3-foreground = ${colors.rose}
ramp-capacity-4-foreground = ${colors.rose}
ramp-capacity-5-foreground = ${colors.accent}
ramp-capacity-6-foreground = ${colors.accent}
ramp-capacity-7-foreground = ${colors.accent}


; =====================================================================
;  RIGHT ISLAND — link + power
; =====================================================================

[module/touchgrass]
type = custom/script
interval = 1
exec = ~/.config/bspwm/custom/touchgrass status
click-left =  ~/.config/bspwm/custom/touchgrass reset
click-right = ~/.config/bspwm/custom/touchgrass lock-now
# format-prefix = " "

;==========================================================

[module/floatall]
type = custom/script
interval = 1
exec = ~/.config/sxhkd/scripts/float-all-toggle status
click-left = ~/.config/sxhkd/scripts/float-all-toggle toggle

;==========================================================

[module/kblayout]
type = custom/script
exec = ~/.config/polybar/scripts/kb-layout.sh
# interval = 1
click-left = ~/.config/polybar/scripts/kb-layout.sh switch
format = <label>
label = %output%
format-padding = 5px

;==========================================================

[module/keydbg]
; keyboard strip: caps / shift / ctrl / alt / super — lit + underlined while held,
; caps lock latched = over+underline (see scripts/key-indicator.py)
type = custom/script
exec = ~/.config/polybar/scripts/key-indicator.py
tail = true
format = <label>
format-font = 4
format-padding = 4px

;==========================================================

[module/shift]
type = custom/script
exec = ~/.config/polybar/scripts/shift-indicator.py
interval = 0
tail = true
format = %{T3}<label>%{T-}

;==========================================================

; study module for time management

[module/study-timer]
type = custom/script
exec = ~/.config/polybar/scripts/study-timer.sh status
interval = 1
click-left = ~/.config/polybar/scripts/study-timer.sh toggle
click-right = ~/.config/polybar/scripts/study-timer.sh reset
format = <label>
label = %output%
label-padding = 9px

;==========================================================


; battery module, combines all BAT* batteries in one output (BAT0 + slice BAT1 on the T450)
[module/batteries]
type = custom/script
exec = ~/.config/polybar/scripts/battery_combined.sh
;interval = 30 
format = %{T8}<label>%{T-}
label = %output%
format-padding = 4px
click-left = ~/.config/polybar/scripts/battery_combined.sh --details


;==========================================================


[module/lhost]
type = custom/script
exec = ~/.config/polybar/scripts/mylhost.sh --bar
interval = 5
format-prefix = %{T3}󰌘%{T-}
format-prefix-foreground = ${colors.fg-dim}
format = <label>
label = %output%
label-padding = 4px
; click = edit inline · double click (or right click) = copy
click-left = ~/.config/polybar/scripts/mylhost.sh --edit
double-click-left = ~/.config/polybar/scripts/mylhost.sh --copy
click-right = ~/.config/polybar/scripts/mylhost.sh --copy


;==========================================================


[module/rhost]
type = custom/script
exec = ~/.config/polybar/scripts/mytarget.sh --bar
interval = 5
format-prefix = %{T3}󰓾%{T-}
format-prefix-foreground = ${colors.fg-dim}
format = <label>
label = %output%
label-padding = 4px
; click = edit inline · double click (or right click) = copy
click-left = ~/.config/polybar/scripts/mytarget.sh --edit
double-click-left = ~/.config/polybar/scripts/mytarget.sh --copy
click-right = ~/.config/polybar/scripts/mytarget.sh --copy


;==========================================================

[module/micvol]
type = custom/script
exec = ~/.config/polybar/scripts/micvol.sh
tail = true
format = <label>
format-font = 5
label = %output%


;==========================================================


[module/systray]
type = internal/tray
format-margin = 0px
tray-spacing = 0px
tray-size = 100%
tray-padding = 4px

[module/pulseaudio]
type = internal/pulseaudio
interval = 2
enable-scroll = true
format-volume = %{A4:~/.config/polybar/scripts/notivol.sh up:}%{A5:~/.config/polybar/scripts/notivol.sh down:}<ramp-volume>%{A}%{A}
; with value: ...<ramp-volume> <label-volume>...
format-volume-prefix = "%{T3}󰕾%{T-} "
format-volume-prefix-foreground = ${colors.fg-dim}
format-volume-padding = 4px
label-volume = %percentage:2%%
; muted: just the mute icon, in red with lines above+below (like Caps Lock) — no text
format-muted = <label-muted>
format-muted-padding = 4px
label-muted = %{u#e5383b}%{o#e5383b}%{+u}%{+o} %{T3}󰖁%{T-} %{-o}%{-u}
label-muted-foreground = ${colors.warn}
ramp-volume-0 = ▁
ramp-volume-1 = ▂
ramp-volume-2 = ▃
ramp-volume-3 = ▄
ramp-volume-4 = ▅
ramp-volume-5 = ▆
ramp-volume-6 = ▇
ramp-volume-7 = █
ramp-volume-0-foreground = ${colors.silver}
ramp-volume-1-foreground = ${colors.silver}
ramp-volume-2-foreground = ${colors.silver}
ramp-volume-3-foreground = ${colors.rose}
ramp-volume-4-foreground = ${colors.rose}
ramp-volume-5-foreground = ${colors.accent}
ramp-volume-6-foreground = ${colors.accent}
ramp-volume-7-foreground = ${colors.accent}

;==========================================================

[module/backlight]
type = internal/backlight
; ls -1 /sys/class/backlight/
card = intel_backlight
enable-scroll = true
format = %{A4:~/.config/polybar/scripts/notibkl.sh up:}%{A5:~/.config/polybar/scripts/notibkl.sh down:}<ramp>%{A}%{A}
; with value: ...<ramp> <label>...
format-prefix = "%{T3}󰃠%{T-} "
format-prefix-foreground = ${colors.fg-dim}
format-padding = 4px
label = %percentage:2%%
ramp-0 = ▁
ramp-1 = ▂
ramp-2 = ▃
ramp-3 = ▄
ramp-4 = ▅
ramp-5 = ▆
ramp-6 = ▇
ramp-7 = █
ramp-0-foreground = ${colors.silver}
ramp-1-foreground = ${colors.silver}
ramp-2-foreground = ${colors.silver}
ramp-3-foreground = ${colors.rose}
ramp-4-foreground = ${colors.rose}
ramp-5-foreground = ${colors.accent}
ramp-6-foreground = ${colors.accent}
ramp-7-foreground = ${colors.accent}
scroll-up = ~/.config/polybar/scripts/notibkl.sh up
scroll-down = ~/.config/polybar/scripts/notibkl.sh down

;==========================================================
; === INACTIVE MODULES (available for future use) ===

;==========================================================

[module/vsep]
; thin separator, same look as the island separators (used between LHOST and RHOST)
type = custom/text
format = "│"
format-foreground = #2a2b30

[module/servermode]
; server mode: keep running with the lid closed (screen locks and goes dark, keyboard light off, no suspend).
; Click toggles, same as super+ctrl+s. Dim = off; lit + underlined = on; shows the battery % while on battery
; (it ends by itself below SERVER_BATTERY_MIN in bspwm/power.conf). Output comes from scripts/servermode.py.
type = custom/script
exec = ~/.config/bspwm/scripts/servermode.py bar --follow
tail = true
click-left = ~/.config/bspwm/scripts/servermode.py toggle &
format = <label>
label = %output%
format-padding = 4px

[module/modetoggle]
; desktop mode toggle: cockpit <-> undercover (Windows 10 look), same as super+ctrl+u
type = custom/text
format = "󰠥"
format-font = 6
format-padding = 4px
format-foreground = ${colors.fg-dim}
click-left = ~/.config/bspwm/scripts/mode.sh toggle &

[module/pwmenu]
type = custom/text
format = "⏻"
format-font = 6
format-padding = 5px
format-foreground = ${colors.accent}
click-left = ~/.config/polybar/scripts/pwmenu.sh &

; =====================================================================
;  INACTIVE MODULES (available)
; =====================================================================

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.fg}

[module/caps]
type = internal/xkeyboard
blacklist-0 = num lock
format = <label-indicator>
label-indicator-on-capslock = A
label-indicator-on-capslock-foreground = ${colors.red}
label-indicator-off-capslock = a
label-indicator-on-capslock-padding = 15px
label-indicator-off-capslock-padding = 15px

[module/autocolor]
type = custom/script
exec = echo ""
click-left = python3 ~/.config/polybar/scripts/color_picker_gui.py
label-padding = 5px

[module/menu]
type = custom/text
format = ☰
format-font = 9
format-padding = 2
click-left = ~/.config/jgmenu/launch-jgmenu.sh &

[settings]
pseudo-transparency = true

; vim:ft=dosini
