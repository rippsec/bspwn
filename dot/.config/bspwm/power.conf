# Power behaviour for the bspwn tools. Plain KEY=VALUE, read live (no restart needed).
# Used by scripts/kbd-backlight.py and scripts/servermode.py.

# ---- keyboard backlight: lights (minimal) on any keypress, turns off a few seconds after the last keypress
KBD_AUTO=1            # 0 = never touch the keyboard backlight
KBD_IDLE_AC=9        # seconds after the last keypress before it turns off, on AC
KBD_IDLE_BAT=9        # ... on battery
KBD_LEVEL=1           # level a keypress lights it to (1 = minimal; 0 = the level it had before)
KBD_WAKE_POINTER=0    # 1 = touchpad/mouse input also lights it (default: keyboard only)

# ---- compositor
PICOM=1               # 1 = run picom on AC (cockpit: fade only, opaque windows, see picom/animations.conf); it is always off on battery. 0 = never

# ---- battery guard: never let the battery die with the laptop running or asleep
# On this ThinkPad, when the external battery runs out the switch to the internal one fails and cuts the power (also
# inside suspend), and afterwards the internal one stays locked out until it gets charge, although it runs the laptop fine.
# The worn external's % gauge lies (59% -> 4% in 15 s, seen in a recalibration), so the guard also watches its VOLTAGE.
# It warns (pull the external out now: a clean switch), then hibernates in time; plugging in power cancels.
GUARD_ENABLED=1
GUARD_BATTERY=active      # active = whichever battery is powering the laptop (follows the battery switch)
GUARD_WARN_PCT=15         # warn at or below this % ...
GUARD_WARN_MIN=8          # ... or with this many minutes left at the current draw
GUARD_WARN_MV=11000       # ... or at this voltage in mV (3-cell packs; 0 = off). Below it suspend is blocked too.
                          # The slice sits at 11.1-11.26 V from 58% to 31% at ~5 W, so keep this below that plateau
GUARD_ACT_PCT=7           # act at or below this % ...
GUARD_ACT_MIN=4           # ... or with this many minutes left (a small or worn battery's % is unreliable)
GUARD_ACT_MV=10850        # ... or at this voltage (the external collapsed from 10.76 V to empty within seconds)
GUARD_MV_HOLD=6           # the voltage must stay that low this many seconds (a load spike sags it ~0.4 V for a moment)
GUARD_GRACE_MV=5          # countdown in seconds when the voltage triggered it
GUARD_ACTION=hibernate    # poweroff | hibernate (only if resume from hibernation is set up) | none (notify only)
GUARD_SWAP_HINT=1         # two batteries: the warnings suggest pulling the low external battery out (a clean, safe switch;
                          # the firmware refuses to switch batteries by itself while on battery)
GUARD_GRACE=30            # seconds of countdown before acting
GUARD_NO_SUSPEND_BELOW=30 # on battery below this %, the laptop does not suspend (lid, idle or menu) so the guard can act

# ---- server mode (button in polybar next to the mode switcher, super+ctrl+s, `servermode.py on|off`)
# Lid closed + server mode = keep running (screen locks and goes dark, keyboard light off, no suspend).
# On AC it runs until you turn it off. On battery it keeps running until the charge drops below this %, then it
# turns itself off and the laptop does the normal thing (suspends if the lid is closed).
#   auto = 20 for laptops with two batteries (ThinkPad with the slice), 55 for single-battery laptops.
#   The charge is the TOTAL across all batteries. Set a number (e.g. 60) to override on a machine.
SERVER_BATTERY_MIN=auto
# Which charge is compared with SERVER_BATTERY_MIN: auto, total (all batteries), lowest, or one battery by name.
#   auto = the slice/external battery (BAT1) on a two-battery ThinkPad, the only battery on a one-battery laptop (e.g. a Dell).
SERVER_BATTERY=active
# Heat guard, DISABLED (this ThinkPad runs hot under normal load, even more in summer). Uncomment to end server mode
# and suspend above a temperature in degrees C (useful for a laptop that might end up in a bag):
#SERVER_TEMP_MAX=88
SERVER_LOCK=1         # lock the screen when the lid closes (acpid's lid.sh usually does it first; this is the fallback)
SERVER_SCREEN_OFF=1   # display off while the lid is closed
