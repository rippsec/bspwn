# Undercover profile: Windows 10 look (assets from the kali-undercover package).
GTK_THEME_NAME="Windows-10"
ICON_THEME="Windows-10-Icons"
CURSOR_THEME="Windows-10-Icons"
CURSOR_SIZE=24
UI_FONT="Liberation Sans 11"
COLOR_SCHEME="default"
WALLPAPER="/usr/share/kali-undercover/backgrounds/Windows-10.jpg"
PICOM_CONF="$HOME/.config/picom/picom-undercover.conf"
PANEL=tint2
CONKY=0
WM=xfwm4                # window manager under the session launcher: xfwm4 = floating windows with Windows-10 frames
FLOATING=1              # without the launcher (bspwm stays): float the windows (no frames)
TOP_PAD=0
BOTTOM_PAD=40           # tint2 panel height
GAP=0
BORDER=1
FOCUSED_COLOR="#0078d7"
ACTIVE_COLOR="#3b3b3b"
NORMAL_COLOR="#2b2b2b"
