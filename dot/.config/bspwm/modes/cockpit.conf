ICON_THEME="Flat-Remix-Blue-Dark"
CURSOR_THEME="breeze_cursors"
CURSOR_SIZE=24
UI_FONT="Noto Sans 10"
COLOR_SCHEME="prefer-dark"
WALLPAPER="$HOME/.bspwn/assets/wallpaper/minimal.jpg"
PICOM_CONF="$HOME/.config/picom/picom.conf"
