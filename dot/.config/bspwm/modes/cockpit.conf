# Cockpit profile (default): the monochrome rice. Sourced by scripts/mode.sh.
GTK_THEME_NAME="Flat-Remix-GTK-Slate-Darkest"
ICON_THEME="Flat-Remix-Black-Dark"
CURSOR_THEME="breeze_cursors"
CURSOR_SIZE=24
UI_FONT="Noto Sans 10"
COLOR_SCHEME="prefer-dark"
WALLPAPER="$HOME/.bspwn/assets/wallpaper/bspwn.jpg"
# personal wallpaper (user name) made by install.sh -wallpaper; used when present
[[ -f $HOME/.local/share/bspwn/wallpaper.jpg ]] && WALLPAPER="$HOME/.local/share/bspwn/wallpaper.jpg"
PICOM_CONF="$HOME/.config/picom/animations.conf"   # animations only: no shadows, blur or transparency (picom.conf = full effects)
PANEL=polybar           # polybar | tint2
CONKY=1                 # HUD on/off
FLOATING=0              # 1 = new windows float (Windows-like)
TOP_PAD=34              # polybar: 6 offset + 28 height
BOTTOM_PAD=0
GAP=8
BORDER=2
FOCUSED_COLOR="#8e9099"
ACTIVE_COLOR="#4b4d55"
NORMAL_COLOR="#16171a"
