# Lean picom for low-end hardware: a subtle fade-in / fade-out of windows ONLY.
# No scale or slide animations, no shadows, no blur, no rounded corners, no transparency (windows are
# fully opaque once the fade ends). Fullscreen windows bypass the compositor (unredir), so video costs nothing extra.
# Use it by setting PICOM=1 in power.conf and PICOM_CONF=$HOME/.config/picom/animations.conf in the mode profile.

backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
log-level = "warn";

shadow = false;
corner-radius = 0;
detect-rounded-corners = false;

# fade: 0.2 s in, 0.2 s out (step per 10 ms frame: 0.05 = 20 steps; larger = faster)
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;
# bars, HUD, notifications, popups and the lock screen appear instantly
fade-exclude = [
  "window_type = 'dock'", "window_type = 'desktop'", "window_type = 'notification'",
  "window_type = 'tooltip'", "window_type = 'popup_menu'", "window_type = 'dropdown_menu'",
  "class_g = 'Conky'", "class_g = 'Polybar'", "class_g *= 'dunst'", "class_g *= 'Rofi'",
  "class_g *= 'rofi'", "class_g = 'Jgmenu'", "class_g = 'I3lock'", "class_g = 'i3lock'"
];
