# Lean picom for low-end hardware: window open/close animations ONLY.
# No shadows, no blur, no fading, no rounded corners, no transparency (windows are fully opaque
# once the animation ends). Fullscreen windows bypass the compositor (unredir), so video costs nothing extra.
# Use it by setting PICOM=1 in power.conf and PICOM_CONF=$HOME/.config/picom/animations.conf in the mode profile.

backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
log-level = "warn";

shadow = false;
fading = false;
corner-radius = 0;
detect-rounded-corners = false;

# short on purpose: a few frames are all this GPU should spend
animations = (
  { triggers = [ "open", "show" ];  preset = "appear";    scale = 0.96; duration = 0.12; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.96; duration = 0.10; }
);

# bars, HUD, notifications and popups appear instantly
rules = (
  { match = "window_type = 'dock' || window_type = 'desktop' || window_type = 'notification' || window_type = 'tooltip' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || class_g = 'Conky' || class_g = 'Polybar' || class_g *= 'dunst' || class_g *= 'Rofi' || class_g *= 'rofi' || class_g = 'Jgmenu'";
    animations = (); }
);
