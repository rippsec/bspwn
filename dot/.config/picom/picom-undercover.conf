# picom for undercover mode (Windows 10 look): flat, no blur, no rounded corners.
backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;

shadow = true;
shadow-radius = 8;
shadow-opacity = 0.35;
shadow-offset-x = -6;
shadow-offset-y = -4;
shadow-exclude = [
  "class_g = 'tint2'",
  "class_g = 'Rofi'", "class_g = 'rofi'",
  "_NET_WM_WINDOW_TYPE@:a *= 'DOCK'",
  "_NET_WM_WINDOW_TYPE@:a *= 'DESKTOP'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-exclude = [ "class_g = 'Rofi'", "class_g = 'rofi'" ];

inactive-opacity = 1.0;
frame-opacity = 1.0;
corner-radius = 0;
blur-background = false;
