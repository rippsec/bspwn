<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Default monospace font -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>BlexMono Nerd Font Mono</family>
    </prefer>
  </alias>
  
  <!-- Default sans-serif font (you can change this too) -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>BlexMono Nerd Font Mono</family>
    </prefer>
  </alias>
  
  <!-- Default serif font (you can change this too) -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>BlexMono Nerd Font Mono</family>
    </prefer>
  </alias>
  
  <!-- Font rendering settings -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>

  <!-- Sharp/no-AA rendering for Alacritty only. DISABLED: Alacritty now uses
       the antialiased defaults above. To get pixel-sharp text back, delete the
       two lines marked "NO-AA-ALACRITTY" below, then reopen Alacritty.
       See README.md -> "Antialiasing de fuentes". -->
  <!-- NO-AA-ALACRITTY (delete this line to enable)
  <match target="font">
    <test name="prgname" compare="eq">
      <string>alacritty</string>
    </test>
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintfull</const>
    </edit>
  </match>
  NO-AA-ALACRITTY (delete this line to enable) -->
</fontconfig>
