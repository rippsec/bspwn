# lsd colours routed through the terminal palette (indices 0-15 = ANSI slots of kitty/alacritty),
# so they follow the cockpit palette instead of lsd's fixed 256-colour defaults (neon green dates,
# near-white users). File-name colours (dir/symlink/exec...) still come from LS_COLORS.
user: 7
group: 7
permission:
  read: 2
  write: 3
  exec: 1
  exec-sticky: 5
  no-access: 8
  octal: 6
  acl: 6
  context: 6
date:
  hour-old: 10
  day-old: 2
  older: 8
size:
  none: 8
  small: 7
  medium: 3
  large: 1
inode:
  valid: 5
  invalid: 8
links:
  valid: 5
  invalid: 8
tree-edge: 8
git-status:
  default: 8
  unmodified: 8
  ignored: 8
  new-in-index: 2
  new-in-workdir: 2
  typechange: 3
  deleted: 1
  renamed: 2
  modified: 3
  conflicted: 1
