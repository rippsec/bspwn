#Optimized for vim-like navigation and keyboard-only usage

set -g prefix C-b
set -g prefix2 C-b
unbind-key -n C-a
unbind-key -T prefix C-a
bind C-b send-prefix

# split lines colors
set -g pane-border-style fg="#808080"
set -g pane-active-border-style fg="#808080"
# single box-drawing lines (1 px, same grey as Claude Code's input rule)
set -g pane-border-lines single

#Set default terminal for proper colors
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-256color:RGB"   # -g (not -ag): a reload starts the list fresh

set -ag terminal-overrides ",*:XT@"
# true colour only for GUI terminals; a Linux text console (TERM=linux) gets the 8 basic colours
set -ag terminal-overrides ",xterm*:Tc,alacritty*:Tc,*kitty*:Tc,tmux*:Tc,screen*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[0 q'

# Mouse support on by default (Alt+m toggles it)
set -g mouse on
bind-key -n M-m run-shell "tmux set -g mouse \$(tmux show -g mouse | grep -q 'on' && echo 'off' || echo 'on') && tmux display \"Mouse mode: \$(tmux show -g mouse | cut -d' ' -f2)\""


#Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

#Renumber windows when one is closed
set -g renumber-windows on

#Increase history limit
set -g history-limit 50000

#reduce escape-time (helps with vim)
set -g escape-time 10

#Enable focus events
set -g focus-events on

#Set status bar update interval
set -g status-interval 1

#Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

#====== Key Bindings ======

#Reload config file
bind r source-file ~/.tmux.conf \; display " Config reloaded!"
bind-key -n M-r source-file ~/.tmux.conf \; display " Config reloaded!"

#===== Window Management =====
#Create new window with current directory
bind t new-window -c "#{pane_current_path}"
bind-key -n M-t new-window -c "#{pane_current_path}"

bind-key -n "M-{" swap-window -d -t -1
bind-key -n "M-}" swap-window -d -t +1

#Switch windows using Alt+number (without prefix)
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

#Next/previous window (with prefix)
#bind "{" next-window
#bind "}" previous-window

#Next/previous window (without prefix, Alt+h/l like vim)
bind-key -n "M-Left" previous-window
bind-key -n "M-Right" next-window

unbind-key -n "M-d" #previous-window
unbind-key -n "M-f" #next-window

#unbind-key -n "M-d" previous-window
#unbind-key -n "M-f" next-window


#Quick window selection
bind-key w choose-tree -Zw

#Rename window
bind-key -n "M-e" command-prompt -I "#W" "rename-window '%%'"

#Kill window
bind w confirm-before -p "Kill window #W? (y/n)" kill-window
bind-key -n M-q confirm-before kill-window

#===== Pane Management =====
#Split panes using | and - (intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind-key -n "M-|" split-window -h -c "#{pane_current_path}"
bind-key -n "M--" split-window -v -c "#{pane_current_path}"

#Vim-like pane navigation (without prefix, using Alt)
bind-key -n M-h select-pane -L
bind-key -n M-l select-pane -R
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U

#Resize panes (with prefix)
bind-key -n M-H resize-pane -L 5
bind-key -n M-J resize-pane -D 5
bind-key -n M-K resize-pane -U 5
bind-key -n M-L resize-pane -R 5

#Toggle between panes (like Alt-Tab)
# bind-key -n M-Tab last-pane
unbind-key -n M-Tab

#Swap/Switch panes
bind-key -n M-, swap-pane -U
bind-key -n M-. swap-pane -D

#Break pane to new window
bind b break-pane

#Kill pane
bind-key -n M-x confirm-before kill-pane
bind-key -n M-w confirm-before kill-pane
bind-key -n M-W kill-pane

#Zoom pane
bind-key -n M-z resize-pane -Z
bind-key -n M-o resize-pane -Z

#===== Copy Mode (Vi Mode) =====
#Vi mode
setw -g mode-keys vi

#Enter copy mode
bind Escape copy-mode

#Copy mode key bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard -i"
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

#Mouse drag: copy to clipboard, stay in copy mode (Ctrl+Shift+C is intercepted by the terminal emulator)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -selection clipboard -i"

#Fix PageUp/PageDown behavior
unbind -n PPage  #Remove PageUp binding
unbind -n NPage  #Remove PageDown binding

#Search in copy mode (forward and backward)
bind-key -T copy-mode-vi / command-prompt -i -p "Search forward:" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "Search backward:" "send -X search-backward-incremental \"%%%\""

#Move by words in copy mode
bind-key -T copy-mode-vi b send-keys -X previous-word
bind-key -T copy-mode-vi w send-keys -X next-word
bind-key -T copy-mode-vi e send-keys -X next-word-end

#Quick access to copy mode
bind-key -n M-v copy-mode

#Paste buffer
bind p paste-buffer

#Choose which buffer to paste
bind P choose-buffer

#===== Session Management =====

#Create new session
bind S command-prompt -p "New session name:" "new-session -s '%%'"

#Switch sessions
bind s choose-tree -Zs

#Detach from session
bind d detach-client

#===== Status Bar Configuration =====
#Status bar position
set-option -g status-position top

#Status bar style
set -g status-style bg="black",fg="red"

#Window status format
# One look for GUI terminals and text consoles (tty, 8 colours), chosen per client; the window list has no
# background of its own, it sits on the bar colour:
#   other windows  = gray text, " 1:name "
#   current window = red text in brackets, "[1:name]", where the terminal has true colour (RGB);
#                    reverse video with a "+" after the name on a tty (every Linux console can draw it)
#   "*" = new output or a bell (in red #d78a7b); "^" = zoomed pane (plain ASCII, so a tty shows them too)
set -g window-status-separator ""
set -g window-status-format " #I:#{=10:window_name}#{?#{||:#{window_activity_flag},#{window_bell_flag}},#[fg=#d78a7b]*#[default],}#{?window_zoomed_flag,^,} "
set -g window-status-current-format "#{?#{m:*RGB*,#{client_termfeatures}},[,#[reverse]}#I:#{=10:window_name}#{?#{m:*RGB*,#{client_termfeatures}},],+}#{?window_zoomed_flag,^,}"
set -g window-status-current-style fg="red"
set -g window-status-style fg="gray"
set -g window-status-activity-style fg="gray"   # same as other windows; the "*" marks it
set -g window-status-bell-style fg="gray"

#Left status
set -g status-left-length 100
set -g status-left-style fg="gray"

# session name on the left: #3c3f42 (the bar colour #2e3135 10% brighter, then 10% darker), text #e6e3dd like the current window
set -g status-left "#[bg=#3c3f42,fg=#e6e3dd] #S #[default]"

#Right status

set -g status-right-length 200
# set -g status-right "| #(~/.config/polybar/scripts/mylhost.sh) | #(~/.config/polybar/scripts/mytarget.sh) | #(awk '{s+=$1;n++}END{print int(s/n)\"%\"}' /sys/class/power_supply/BAT*/capacity 2>/dev/null) | #(iwconfig 2>/dev/null | grep -m1 'Signal level' | grep -oE 'level=[-0-9]+' | grep -oE '[-0-9]+')dBm | #{window_height}x#{window_width} |#[bg=white,fg=black]  %H:%M  #[default]"

#set -g status-right "| #(~/.config/polybar/scripts/mylhost.sh) | #(~/.config/polybar/scripts/mytarget.sh) | #{window_height}x#{window_width} |#[bg=white,fg=black]  %H:%M  #[default]"

# pane size on #383a3d, clock on #3c3f42 like the session name (both 10% darker than before), text #e6e3dd like the
# current window; no separators and no gaps: the blocks touch
set -g status-right "#[bg=#383a3d,fg=#e6e3dd] #{window_height}x#{window_width} #[bg=#3c3f42] %H:%M #[default]"

set -g status-right-style fg="gray"

#Message style
set -g message-style bg="white",fg="black"
#Fill the whole status line while a prompt (rename / search) is open, so the window list does not show through
set -g message-format '#[fill=white,#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}'

#Selection style
set -g mode-style "fg=#7aa2f7,bg=#28344a"

#===== Additional Bindings =====

#Open clock
bind-key T clock-mode

#Clear screen and history (like Ctrl+L in bash)
bind C-l send-keys -R \; clear-history

#Toggle status bar visibility
bind-key C-s set-option -g status

#===== Misc =====

bind-key -n M-space next-layout

#===== System-specific configurations =====

#Linux clipboard support with xclip (uncomment if needed)
#bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
#bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

#Set terminal window title
set-option -g set-titles on
set-option -g set-titles-string "#S/#W"

#Source local config if it exists
if-shell "[ -f ~/.tmux.conf.local ]" 'source ~/.tmux.conf.local'
