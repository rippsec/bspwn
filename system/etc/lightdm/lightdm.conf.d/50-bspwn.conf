# Shared machine: XFCE is always preselected for whoever logs in;
# bspwm is picked from the session menu (top-right of the greeter).
[LightDM]
# only offer XFCE and bspwm (hide GNOME, Default Xsession, Wayland variants)
sessions-directory=/etc/lightdm/xsessions

[Seat:*]
user-session=xfce
# lightdm remembers each user's last session (AccountsService); reset it to
# XFCE every time the greeter is shown (boot and after every logout)
greeter-setup-script=/usr/local/sbin/lightdm-default-xfce
